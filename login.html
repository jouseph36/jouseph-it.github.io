<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - IT NEXUS</title>
    <style>
        /* التنسيقات الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* استخدم نفس فيديو الخلفية أو الصورة لتوحيد التصميم */
            background: #0f0f0f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* خلفية الفيديو (اختياري، يمكنك حذفها لو أردت لون أسود فقط) */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            filter: brightness(0.4);
            /* تعتيم الفيديو لراحة العين */
            object-fit: cover;
        }

        /* حاوية تسجيل الدخول (Glassmorphism) */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            color: #4facfe;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .login-card p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* تنسيق الحقول */
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.3);
        }

        /* زر الدخول */
        .login-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* روابط إضافية */
        .extra-links {
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .extra-links a {
            color: #4facfe;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <video autoplay muted loop id="bg-video">
        <source src="background-video.mp4" type="video/mp4">
    </video>

    <a href="lkl.html" class="back-home">← العودة للرئيسية</a>

    <div class="login-card">
        <h2>IT NEXUS</h2>
        <p>مرحباً بك مجدداً، يرجى تسجيل الدخول</p>

        <form id="loginForm">
            <div class="input-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="username" placeholder="أدخل بياناتك هنا" required>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-submit">دخول</button>
        </form>

        <div class="extra-links">
            <a href="#">نسيت كلمة المرور؟</a> | <a href="#">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // هنا يمكنك إضافة منطق التحقق من البيانات
            if (user === "admin" && pass === "1234") {
                alert("تم تسجيل الدخول بنجاح! سيتم تحويلك للرئيسية.");
                window.location.href = "lkl.html";
            } else {
                alert("بيانات الدخول غير صحيحة، حاول مجدداً (تجربة: admin / 1234)");
            }
        });
    </script>

</body>

</html>
