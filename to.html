<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Glass Card</title>

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 200px;
            height: 240px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            text-align: center;
            padding: 20px;
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.1);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            box-shadow: 0 0 28px rgba(0, 200, 255, 0.5);
            transform: translateY(-6px);
        }

        .content {
            margin-top: 20px;
        }

        .content h2 {
            margin: 0;
            font-size: 24px;
        }

        .content p {
            margin: 10px 0 0;
            font-size: 16px;
            opacity: 0.9;
        }

        .card button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            padding: 10px 0;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .card button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 200, 255, 0.8);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="content">
            <h2>Python 1</h2>
            <br>
            <p>منصة سطر</p>
        </div>

        <button onclick="openLink()">انقر هنا</button>
    </div>

    <script>
        function openLink() {
            window.open("https://satr.codes", "_blank");
        }
    </script>

</body>

</html>
